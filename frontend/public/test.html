<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亲人纪念堂 - 测试</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #fef3c7 0%, #f3e8ff 100%);
            min-height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 32px;
            border-radius: 16px;

        p {

            margin: 16px 0;

<body>
    <div class="container">
        <div class="emoji">🏛️</div>
        <h1>亲人纪念堂</h1>
        <p>3D 纪念堂前端应用</p>
        <p>✅ 页面加载成功</p>
        <p style="margin-top: 24px; font-size: 14px;">
            如果看到这个页面，说明 Vite 服务器正常运行。<br>
            空白页面可能是 React 组件有 JavaScript 错误。<br>
            请按 F12 打开浏览器控制台查看详细错误信息。
